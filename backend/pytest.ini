[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    performance: Performance tests
    asyncio: Asynchronous tests

# Warnings
filterwarnings =
    # Ignore Pydantic V2 deprecation warnings for now
    ignore::DeprecationWarning:pydantic
    # Ignore specific Pydantic deprecation messages
    ignore:.*Pydantic V1 style.*:DeprecationWarning
    ignore:.*class-based `config`.*:DeprecationWarning
    ignore:.*json_encoders.*:DeprecationWarning
    ignore:.*min_items.*:DeprecationWarning
    ignore:.*max_items.*:DeprecationWarning
    ignore:.*extra keyword arguments.*:DeprecationWarning

# Asyncio configuration
asyncio_mode = auto

# Output options
addopts = 
    --tb=short
    --strict-markers
    -ra